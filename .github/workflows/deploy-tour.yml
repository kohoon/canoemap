name: Deploy tour

on:
  push:
    branches: [main]
    paths:
      - "tour/**"
      - "protect_polygons.geojson"
      - "wlz.geojson"
      - "waterplay.geojson"
      - "rivers.geojson"
      - "roads.geojson"
      - "daiso_stores.geojson"
      - "og.png"
      - "tests/**"
      - ".github/workflows/deploy-tour.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tour-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Prepare Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/mycanoe-tour"
          cp tour/index.html "$RUNNER_TEMP/mycanoe-tour/index.html"
          cp tour/service-worker.js tour/manifest.webmanifest tour/pwa-icon.svg "$RUNNER_TEMP/mycanoe-tour/"
          cp protect_polygons.geojson wlz.geojson waterplay.geojson rivers.geojson roads.geojson daiso_stores.geojson og.png "$RUNNER_TEMP/mycanoe-tour/"

      - name: Deploy Cloudflare Pages
        run: npx --yes wrangler pages deploy "$RUNNER_TEMP/mycanoe-tour" --project-name mycanoe-tour --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
