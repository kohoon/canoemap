name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "wrangler.toml"
      - "tests/test_admin_campsites.py"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Verify comment ownership and audit
        run: node tests/test_comment_ownership.mjs

      - name: Verify nickname change cooldown
        run: node tests/test_member_nickname.mjs

      - name: Verify Bongyang course direction
        run: node tests/test_bongyang_direction.mjs

      - name: Verify Cheongmi course direction
        run: node tests/test_cheongmi_direction.mjs

      - name: Verify place suggestion review workflow
        run: node tests/test_place_suggestions_worker.mjs

      - name: Deploy Cloudflare Worker
        run: npx --yes wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
