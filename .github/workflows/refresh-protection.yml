name: Refresh VWorld protection zones weekly

on:
  schedule:
    # Tuesday 06:00 Asia/Seoul (Monday 21:00 UTC).
    - cron: "0 21 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-vworld-protection
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry validation dependency
        run: python3 -m pip install shapely==2.1.2
      - name: Collect and validate protection polygons
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: https://canoe.crowdbase.kr
        run: python3 -u tools/refresh_protect.py
      - name: Verify protection collection and published data
        run: python3 -m unittest discover -s tests -p 'test_protect_refresh.py'
      - name: Commit snapshot and map cache keys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protect_polygons.geojson index.html map.html test.html tour/legacy.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh VWorld water protection boundaries"
          git push origin HEAD:main
      # Bot pushes need explicit publication.
      - name: Publish map and tour snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          gh workflow run deploy-tour.yml --repo "$GITHUB_REPOSITORY" --ref main
