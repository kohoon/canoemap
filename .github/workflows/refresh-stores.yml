name: Refresh store locations weekly

on:
  schedule:
    # Monday 06:00 Asia/Seoul (Sunday 21:00 UTC).
    - cron: "0 21 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh-store-locations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and validate both official store datasets
        run: python3 -u tools/refresh_stores.py
      - name: Verify store layers
        run: python3 -m unittest discover -s tests -p 'test_*_layer.py'
      - name: Commit snapshots and cache keys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daiso_stores.geojson hanaro_stores.geojson index.html map.html test.html tour/legacy.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh official Daiso and Hanaro store locations"
          git push origin HEAD:main
      # Bot pushes do not automatically trigger other workflows or Pages builds.
      - name: Publish map and tour snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          gh workflow run deploy-tour.yml --repo "$GITHUB_REPOSITORY" --ref main
