name: Transfer Expedition 12 course

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect first, then apply with the exact course ID
        required: true
        type: choice
        options: [inspect, apply]
      course_id:
        description: Exact course ID from inspect (required for apply)
        required: false
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: transfer-expedition12-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect or transfer the single course
        run: node tools/transfer_expedition12.mjs
        env:
          TRANSFER_MODE: ${{ inputs.mode }}
          EXPECTED_COURSE_ID: ${{ inputs.course_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
