name: Read-only launch-place review snapshot
on:
  push:
    branches: [codex/omi-launch-review-20261117]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy temporary encrypted read-only reviewer
        run: npx --yes wrangler deploy --config ops/review/review.toml
      - name: Fetch encrypted snapshot
        run: curl --fail --retry 3 --silent --show-error https://canoemap-launch-review-20261117.kohoon0140.workers.dev/ -o "$RUNNER_TEMP/launch-places.encrypted.json"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-launch-review
          path: ${{ runner.temp }}/launch-places.encrypted.json
          retention-days: 1
      - name: Remove temporary reviewer
        if: always()
        run: npx --yes wrangler delete --name canoemap-launch-review-20261117 --force
