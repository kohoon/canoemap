          import os,json,urllib.request,urllib.error,pathlib,datetime
          namespace='fa39499b8c8346408f24fd07a323d9e0'
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/storage/kv/namespaces/'+namespace+'/values/'
          result={'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'values':{}}
          for key in ['launch_sites_v1','placeover','placecat','places']:
              req=urllib.request.Request(base+key,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urllib.request.urlopen(req,timeout=40) as response:
                      result['values'][key]=json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code==404:
                      result['values'][key]=None
                  else:
                      raise SystemExit('KV read failed HTTP '+str(error.code)+' for '+key)
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp/'launch-places.json').write_text(json.dumps(result,ensure_ascii=False))
          (temp/'review-public.pem').write_text(os.environ['RECIPIENT_CERT'])
          print('Read four place keys. Preparing encrypted review artifact.')
          CODE
          openssl cms -encrypt -aes256 -binary -in "$RUNNER_TEMP/launch-places.json" -out "$RUNNER_TEMP/launch-places.cms" -outform DER "$RUNNER_TEMP/review-public.pem"
          rm "$RUNNER_TEMP/launch-places.json"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-launch-review
          path: ${{ runner.temp }}/launch-places.cms
          retention-days: 1
