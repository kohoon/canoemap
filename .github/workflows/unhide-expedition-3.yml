name: Unhide expedition 3 once

on:
  workflow_dispatch:

jobs:
  unhide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove only course 3 from the production hidden list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler kv key get course_hidden --binding PLACES --remote --text > "$RUNNER_TEMP/hidden-before.json"
          jq -e '. == ["3"]' "$RUNNER_TEMP/hidden-before.json" > /dev/null
          jq -c 'map(select(. != "3"))' "$RUNNER_TEMP/hidden-before.json" > "$RUNNER_TEMP/hidden-after.json"
          npx --yes wrangler kv key put course_hidden --binding PLACES --remote --path "$RUNNER_TEMP/hidden-after.json"
          npx --yes wrangler kv key get course_hidden --binding PLACES --remote --text > "$RUNNER_TEMP/hidden-check.json"
          jq -e '. == []' "$RUNNER_TEMP/hidden-check.json" > /dev/null
