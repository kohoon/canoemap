<div id="course-og-preview" aria-label="카누맵 코스 링크 미리보기 시안">
  <svg id="course-og-map" role="img" aria-label="북한강 종주 1 코스의 전체 경로, 출발점과 도착점, 거리 22.86킬로미터가 표시된 지도"></svg>
</div>

<style>
  #course-og-preview {
    --ink: light-dark(#14231e, #eef7f2);
    --muted: light-dark(#5d6d65, #a9bbb2);
    --land: light-dark(#edf2e6, #17221e);
    --land-2: light-dark(#e1ead8, #1d2c26);
    --water: light-dark(#dfeff2, #17333b);
    --river: light-dark(#9cc7d1, #447c88);
    --route: light-dark(#d500f9, #ee75ff);
    --surface: light-dark(#ffffff, #111a17);
    --border: light-dark(#cbd8cf, #385048);
    width: min(1200px, 100%);
    aspect-ratio: 1200 / 630;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--land);
    color-scheme: light dark;
    box-shadow: 0 18px 52px rgba(21, 45, 37, 0.16);
  }

  #course-og-map {
    display: block;
    width: 100%;
    height: 100%;
    font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
  }

  #course-og-map .river {
    fill: none;
    stroke: var(--river);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #course-og-map .route-halo {
    fill: none;
    stroke: var(--surface);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.94;
  }

  #course-og-map .route {
    fill: none;
    stroke: var(--route);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #course-og-map .label {
    paint-order: stroke;
    stroke: var(--surface);
    stroke-width: 5px;
    stroke-linejoin: round;
  }
</style>

<script type="module">
  import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm";

  const routeLatLng = [
    [38.20519,127.850647],[38.205027,127.851052],[38.198208,127.846677],[38.194228,127.84775],
    [38.188292,127.856848],[38.180061,127.860196],[38.173246,127.859938],[38.168523,127.857707],
    [38.162652,127.861054],[38.158603,127.862341],[38.151179,127.863629],[38.140919,127.859595],
    [38.13221,127.857707],[38.126134,127.858307],[38.124581,127.868865],[38.119044,127.876332],
    [38.116955,127.87845],[38.111593,127.878091],[38.106796,127.876418],[38.103522,127.872992],
    [38.102316,127.869315],[38.102075,127.865463],[38.102867,127.861436],[38.104658,127.856971],
    [38.110101,127.850054],[38.11289,127.841255],[38.113855,127.834514],[38.113442,127.828166],
    [38.112236,127.824664],[38.107104,127.818229],[38.105244,127.813852],[38.103728,127.807898],
    [38.102833,127.797173],[38.100889,127.784904],[38.100767,127.781747],[38.101376,127.779642],
    [38.096304,127.776642]
  ];

  const contextLines = [
    [[127.821283,38.297737],[127.812502,38.288853],[127.8127,38.26944],[127.803443,38.255786],[127.806952,38.247802],[127.825575,38.242354],[127.830153,38.236652],[127.832723,38.224053],[127.841169,38.210954],[127.851956,38.206437],[127.846677,38.198208],[127.856848,38.188292],[127.860196,38.180061],[127.857707,38.168523],[127.863629,38.151179],[127.857707,38.13221],[127.868865,38.124581],[127.87845,38.116955],[127.876418,38.106796],[127.865463,38.102075],[127.850054,38.110101],[127.834514,38.113855],[127.818229,38.107104],[127.797173,38.102833],[127.781747,38.100767],[127.774658,38.1071],[127.778593,38.117184],[127.775145,38.126641],[127.766091,38.13051],[127.760953,38.125299],[127.763259,38.110967],[127.759563,38.097573],[127.752822,38.08567],[127.740083,38.084947],[127.726973,38.093612],[127.706026,38.100863]],
    [[127.87822,38.113518],[127.885065,38.118453],[127.895408,38.119433],[127.906737,38.126725],[127.912874,38.130405],[127.909956,38.136919],[127.900075,38.141679],[127.889442,38.14551],[127.892522,38.1532],[127.897028,38.157465],[127.901703,38.164938],[127.899108,38.168815],[127.908363,38.177367],[127.903129,38.182388],[127.895998,38.183807],[127.905041,38.184666],[127.918211,38.184392],[127.929454,38.184702],[127.936316,38.190057],[127.927949,38.190203],[127.922024,38.195129],[127.933471,38.19727],[127.941862,38.205607],[127.952844,38.205297],[127.959909,38.20752]],
    [[127.954275,38.136949],[127.948406,38.139435],[127.940354,38.137738],[127.934384,38.142414],[127.926784,38.139691],[127.919636,38.140342],[127.916927,38.132609],[127.912874,38.130405]],
    [[127.890924,38.293996],[127.892061,38.285524],[127.898391,38.276496],[127.895108,38.266304],[127.89468,38.256748],[127.88889,38.249827],[127.88208,38.243669],[127.878694,38.237634],[127.875975,38.232267],[127.870021,38.221808],[127.864225,38.216513],[127.858298,38.212063],[127.851956,38.206437]],
    [[127.938239,38.101607],[127.930428,38.105689],[127.921782,38.107149],[127.916847,38.109108],[127.914237,38.115141],[127.909128,38.116655]]
  ];

  const route = { type: "LineString", coordinates: routeLatLng.map(([lat, lng]) => [lng, lat]) };
  const nearby = { type: "FeatureCollection", features: contextLines.map(coordinates => ({ type: "Feature", geometry: { type: "LineString", coordinates } })) };
  const svg = d3.select("#course-og-map").attr("viewBox", "0 0 1200 630");

  const defs = svg.append("defs");
  const pattern = defs.append("pattern").attr("id", "terrain-grid").attr("width", 42).attr("height", 42).attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(30)");
  pattern.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 42).attr("stroke", "var(--land-2)").attr("stroke-width", 1);
  const shadow = defs.append("filter").attr("id", "soft-shadow").attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
  shadow.append("feDropShadow").attr("dx", 0).attr("dy", 3).attr("stdDeviation", 5).attr("flood-color", "#173d32").attr("flood-opacity", 0.22);

  svg.append("rect").attr("width", 1200).attr("height", 630).attr("fill", "var(--land)");
  svg.append("rect").attr("width", 1200).attr("height", 630).attr("fill", "url(#terrain-grid)").attr("opacity", 0.7);

  const mapFrame = { x: 500, y: 38, width: 658, height: 554 };
  const projection = d3.geoMercator().fitExtent(
    [[mapFrame.x + 34, mapFrame.y + 24], [mapFrame.x + mapFrame.width - 34, mapFrame.y + mapFrame.height - 24]],
    { type: "Feature", geometry: route }
  );
  const path = d3.geoPath(projection);

  svg.append("g")
    .selectAll("path")
    .data(nearby.features)
    .join("path")
    .attr("class", "river")
    .attr("d", path)
    .attr("stroke-width", (_, i) => i === 0 ? 8 : i < 3 ? 4.5 : 2.5)
    .attr("opacity", (_, i) => i === 0 ? 0.72 : 0.48);

  svg.append("path").datum(route).attr("class", "route-halo").attr("d", path);
  svg.append("path").datum(route).attr("class", "route").attr("d", path);

  const start = projection(route.coordinates[0]);
  const finish = projection(route.coordinates.at(-1));

  function marker(point, color, label, anchor) {
    const g = svg.append("g").attr("transform", `translate(${point[0]},${point[1]})`).attr("filter", "url(#soft-shadow)");
    g.append("circle").attr("r", 17).attr("fill", "var(--surface)");
    g.append("circle").attr("r", 11).attr("fill", color);
    const dx = anchor === "start" ? 25 : -25;
    g.append("text")
      .attr("class", "label")
      .attr("x", dx)
      .attr("y", 6)
      .attr("text-anchor", anchor)
      .attr("fill", "var(--ink)")
      .attr("font-size", 19)
      .attr("font-weight", 800)
      .text(label);
  }

  marker(start, "#13a26f", "출발", "start");
  marker(finish, "#ef5b5b", "도착", "end");

  const panel = svg.append("g").attr("transform", "translate(42,42)");
  panel.append("rect")
    .attr("width", 430).attr("height", 546).attr("rx", 26)
    .attr("fill", "var(--surface)").attr("stroke", "var(--border)")
    .attr("filter", "url(#soft-shadow)");

  panel.append("text").attr("x", 34).attr("y", 60).attr("fill", "var(--muted)").attr("font-size", 20).attr("font-weight", 800).text("카누맵 · 추천 코스");
  panel.append("text").attr("x", 34).attr("y", 119).attr("fill", "var(--ink)").attr("font-size", 40).attr("font-weight", 900).text("북한강 종주 #1");
  panel.append("line").attr("x1", 34).attr("x2", 396).attr("y1", 150).attr("y2", 150).attr("stroke", "var(--border)");

  panel.append("text").attr("x", 34).attr("y", 197).attr("fill", "var(--muted)").attr("font-size", 18).attr("font-weight", 700).text("출발");
  panel.append("text").attr("x", 34).attr("y", 231).attr("fill", "var(--ink)").attr("font-size", 25).attr("font-weight", 850).text("평화의댐 오토캠핑장");
  panel.append("text").attr("x", 34).attr("y", 284).attr("fill", "var(--muted)").attr("font-size", 18).attr("font-weight", 700).text("도착");
  panel.append("text").attr("x", 34).attr("y", 318).attr("fill", "var(--ink)").attr("font-size", 25).attr("font-weight", 850).text("파로호유원지 선착장");

  const badge = panel.append("g").attr("transform", "translate(34,365)");
  badge.append("rect").attr("width", 362).attr("height", 88).attr("rx", 18).attr("fill", "var(--land-2)");
  badge.append("text").attr("x", 24).attr("y", 35).attr("fill", "var(--muted)").attr("font-size", 17).attr("font-weight", 750).text("전체 거리");
  badge.append("text").attr("x", 24).attr("y", 70).attr("fill", "var(--ink)").attr("font-size", 32).attr("font-weight", 900).text("22.86 km");

  panel.append("text").attr("x", 34).attr("y", 510).attr("fill", "var(--route)").attr("font-size", 19).attr("font-weight", 850).text("전체 코스를 지도에서 확인하세요 →");

  svg.append("g").attr("transform", "translate(1026,548)")
    .call(g => {
      g.append("rect").attr("width", 116).attr("height", 42).attr("rx", 21).attr("fill", "var(--surface)").attr("stroke", "var(--border)");
      g.append("text").attr("x", 58).attr("y", 28).attr("text-anchor", "middle").attr("fill", "var(--ink)").attr("font-size", 18).attr("font-weight", 900).text("카누맵");
    });
</script>
